version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: travelease-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
    container_name: travelease-api
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=mongodb://mongodb:27017/travelease
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
    container_name: travelease-web
    ports:
      - "3000:3000"

volumes:
  mongo-data:
