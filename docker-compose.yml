version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: travelease-api
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: travelease-web
    ports:
      - "3000:3000"
    restart: unless-stopped
